<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" fill="none">
  <!-- Mock of the "Model aliases" settings page: vendor select with all vendors, alias, key, model rows. -->
  <rect x="30" y="20" width="580" height="300" rx="16" fill="#EEF3FA" stroke="#D8E2EF"/>
  <text x="54" y="56" font-family="sans-serif" font-size="15" font-weight="600" fill="#1F2937">模型别名</text>
  <text x="54" y="78" font-family="sans-serif" font-size="11" fill="#6B7280">厂商照选、密钥各存，用别名区分不同配置。</text>

  <!-- add card -->
  <rect x="54" y="94" width="532" height="150" rx="10" fill="#FFFFFF" stroke="#D8E2EF"/>
  <text x="70" y="118" font-family="sans-serif" font-size="11" fill="#6B7280">厂商</text>
  <rect x="70" y="124" width="220" height="24" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="78" y="140" font-family="sans-serif" font-size="11" fill="#1F2937">OpenAI · 已配置</text>
  <path d="M272 133l5 5 5-5" stroke="#6B7280" stroke-width="1.4" fill="none"/>
  <text x="310" y="118" font-family="sans-serif" font-size="11" fill="#6B7280">别名</text>
  <rect x="310" y="124" width="260" height="24" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="318" y="140" font-family="sans-serif" font-size="11" fill="#1F2937">OpenAI 工作</text>

  <text x="70" y="168" font-family="sans-serif" font-size="11" fill="#6B7280">接口地址</text>
  <rect x="70" y="174" width="330" height="24" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="78" y="190" font-family="sans-serif" font-size="11" fill="#1F2937">https://api.openai.com/v1</text>
  <text x="416" y="168" font-family="sans-serif" font-size="11" fill="#6B7280">API Key</text>
  <rect x="416" y="174" width="154" height="24" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="424" y="190" font-family="sans-serif" font-size="11" fill="#9AA6B8">存为 OPENAI_WORK_API_KEY</text>

  <text x="70" y="218" font-family="sans-serif" font-size="11" fill="#6B7280">模型列表</text>
  <rect x="128" y="206" width="86" height="20" rx="6" fill="#FFFFFF" stroke="#CBD8E8"/>
