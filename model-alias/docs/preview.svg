  <rect x="222" y="206" width="70" height="20" rx="6" fill="#FFFFFF" stroke="#CBD8E8"/>
  <text x="238" y="220" font-family="sans-serif" font-size="10" fill="#1F2937">添加模型</text>

  <rect x="70" y="236" width="230" height="20" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="78" y="250" font-family="sans-serif" font-size="10.5" fill="#1F2937">gpt-4o</text>

  <!-- create button -->
  <rect x="500" y="300" width="86" height="24" rx="7" fill="#247BBF"/>
  <text x="528" y="316" font-family="sans-serif" font-size="11" fill="#FFFFFF">创建</text>

  <!-- existing alias row -->
  <rect x="54" y="258" width="532" height="34" rx="10" fill="#FFFFFF" stroke="#D8E2EF"/>
  <circle cx="72" cy="275" r="4" fill="#34A853"/>
  <text x="84" y="279" font-family="sans-serif" font-size="11" font-weight="600" fill="#1F2937">OpenAI 工作</text>
  <text x="196" y="279" font-family="sans-serif" font-size="10.5" fill="#6B7280">路由 openai-work · OpenAI 兼容</text>
  <rect x="500" y="264" width="42" height="21" rx="6" fill="#F7FAFD" stroke="#CBD8E8"/>
  <text x="512" y="278" font-family="sans-serif" font-size="10" fill="#1F2937">编辑</text>
  <rect x="548" y="264" width="38" height="21" rx="6" fill="#F7FAFD" stroke="#EBD3D3"/>
  <text x="560" y="278" font-family="sans-serif" font-size="10" fill="#C04545">删除</text>
