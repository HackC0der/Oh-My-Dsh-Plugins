<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" fill="none">
  <!-- Right-sidebar excerpt: the panel head with refresh and add actions. -->
  <rect x="40" y="30" width="240" height="242" rx="16" fill="#EEF3FA" stroke="#D8E2EF"/>
  <rect x="56" y="46" width="96" height="7" rx="3.5" fill="#8FB8E8"/>
