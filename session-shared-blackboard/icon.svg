<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <!-- Board frame: the shared blackboard both sides write on. -->
  <rect x="4.5" y="6.5" width="27" height="21" rx="3.5" stroke="#3E7BFA" stroke-width="2"/>
  <!-- Left bubble: the peer side, outlined, tail pointing to the board's center. -->
  <path d="M8.5 12.5h8.2c.7 0 1.3.6 1.3 1.3v3.4c0 .7-.6 1.3-1.3 1.3h-4l-2.1 2.3v-2.3h-2.1c-.7 0-1.3-.6-1.3-1.3v-3.4c0-.7.6-1.3 1.3-1.3z" fill="#3E7BFA" fill-opacity="0.22"/>
  <!-- Right bubble: this side, filled, answering from the other edge. -->
  <path d="M19 17.5h8.2c.7 0 1.3.6 1.3 1.3v3.4c0 .7-.6 1.3-1.3 1.3h-2.1v2.3l-2.1-2.3H19c-.7 0-1.3-.6-1.3-1.3v-3.4c0-.7.6-1.3 1.3-1.3z" fill="#3E7BFA"/>
  <!-- Chalk line under the frame: writing that stays. -->
  <path d="M12 31.5h12" stroke="#3E7BFA" stroke-width="2" stroke-linecap="round"/>
</svg>
